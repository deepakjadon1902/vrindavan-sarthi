plugins {
    id "com.android.application"
    id "com.google.gms.google-services"
}

def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file("keystore.properties")
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    namespace "in.vrindavansarthi.alarm"
    compileSdk 35

    buildFeatures {
        buildConfig true
    }

    defaultConfig {
        applicationId "in.vrindavansarthi.alarm"
        minSdk 26
        targetSdk 35
        versionCode 3
        versionName "1.0.2"
        buildConfigField "String", "APP_URL", "\"https://www.vrindavansarthi.in/login?staff=1&role=partner&vrsApk=1\""
        buildConfigField "String", "API_BASE_URL", "\"https://www.vrindavansarthi.in/api\""
        buildConfigField "String", "UPDATE_MANIFEST_URL", "\"https://www.vrindavansarthi.in/android-app-update.json\""
    }

    signingConfigs {
        release {
            if (keystorePropertiesFile.exists()) {
                storeFile rootProject.file(keystoreProperties["storeFile"])
                storePassword keystoreProperties["storePassword"]
                keyAlias keystoreProperties["keyAlias"]
                keyPassword keystoreProperties["keyPassword"]
            }
        }
    }

    buildTypes {
        release {
            signingConfig keystorePropertiesFile.exists() ? signingConfigs.release : signingConfigs.debug
            minifyEnabled false
            shrinkResources false
        }
    }

    lint {
        checkReleaseBuilds false
        abortOnError false
    }
}

dependencies {
    implementation platform("com.google.firebase:firebase-bom:33.7.0")
    implementation "com.google.firebase:firebase-messaging"
    implementation "androidx.appcompat:appcompat:1.7.0"
    implementation "androidx.core:core:1.15.0"
}
