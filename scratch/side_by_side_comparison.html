<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body {
      margin: 0;
      padding: 24px;
      background: #0f172a;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: #fff;
    }
    h1 {
      text-align: center;
      margin-bottom: 24px;
      font-size: 22px;
      font-weight: 700;
    }
    .grid {
      display: flex;
      gap: 20px;
      justify-content: center;
    }
    .column {
      display: flex;
      flex-direction: column;
      align-items: center;
      background: #1e293b;
      border-radius: 16px;
      padding: 14px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
    }
    .col-title {
      font-size: 15px;
      font-weight: 600;
      margin-bottom: 12px;
      color: #38bdf8;
    }
    img {
      width: 320px;
      height: auto;
      border-radius: 12px;
      border: 1px solid #334155;
    }
  </style>
</head>
<body>
  <h1>Vrindavan Sarthi — Mobile (412px) 2-Column Card Grid Comparison</h1>
  <div class="grid">
    <div class="column">
      <div class="col-title">1. Hotels (/hotels)</div>
      <img src="grid_refined_hotels_mobile_412.png" />
    </div>
    <div class="column">
      <div class="col-title">2. Rooms (/rooms)</div>
      <img src="grid_refined_rooms_mobile_412.png" />
    </div>
    <div class="column">
      <div class="col-title">3. Cabs (/cabs)</div>
      <img src="grid_refined_cabs_mobile_412.png" />
    </div>
    <div class="column">
      <div class="col-title">4. Tours (/tours)</div>
      <img src="grid_refined_tours_mobile_412.png" />
    </div>
  </div>
</body>
</html>
